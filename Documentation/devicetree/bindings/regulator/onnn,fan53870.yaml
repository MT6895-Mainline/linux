%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/onnn,fan53870.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Onsemi FAN53870 camera PMIC

maintainers:
  - Akisaira <akisaira@outlook.com>

description: |
  The FAN53870 provides seven independently controlled LDO outputs over I2C.
  Only outputs listed under regulators are managed. Outputs must use direct
  I2C enable control rather than the hardware sequencer. Explicit voltage
  constraints are required to avoid relying on factory-default voltages.

properties:
  compatible:
    const: onnn,fan53870

  reg:
    maxItems: 1

  enable-gpios:
    maxItems: 1
    description:
      Optional board-level enable signal required for access to the PMIC.
      Held asserted while the regulator provider is registered. The GPIO
      controller must be non-sleeping because the signal is asserted with
      the I2C bus segment locked to keep the rising edge between transactions.

  vin12-supply:
    description: Input supply for LDO1 and LDO2

  vin34-supply:
    description: Input supply for LDO3 and LDO4

  vin5-supply:
    description: Input supply for LDO5

  vin6-supply:
    description: Input supply for LDO6

  vin7-supply:
    description: Input supply for LDO7

  regulators:
    type: object
    additionalProperties: false

    patternProperties:
      "^ldo[1-7]$":
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false
        required:
          - regulator-min-microvolt
          - regulator-max-microvolt

required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        regulator@35 {
            compatible = "onnn,fan53870";
            reg = <0x35>;

            regulators {
                ldo5 {
                    regulator-name = "camera-avdd";
                    regulator-min-microvolt = <2804000>;
                    regulator-max-microvolt = <2804000>;
                };
            };
        };
    };
