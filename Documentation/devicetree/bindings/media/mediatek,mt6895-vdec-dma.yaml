%YAML 1.2
---
$id: http://devicetree.org/schemas/media/mediatek,mt6895-vdec-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6895 VCP Decoder DMA Address Spaces

maintainers:
  - Silvia <2824799@users.noreply.github.com>

description: |
  Auxiliary DMA devices describing the firmware's separate address spaces.
  Compressed bitstreams occupy multimedia IOMMU domain five, pseudo LARB33
  port zero, 0x110000000 through 0x12fffffff. The unified buffer engine uses
  display IOMMU domain one, LARB5 port five, 0x20000000 through 0x32bfffff.

properties:
  compatible:
    enum:
      - mediatek,mt6895-vcp-vdec-dma
      - mediatek,mt6895-vdec-ube-dma

  iommus:
    maxItems: 1

required:
  - compatible
  - iommus

additionalProperties: false
