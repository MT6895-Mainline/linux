%YAML 1.2
---
$id: http://devicetree.org/schemas/media/mediatek,mt6895-vdec-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6895 VCP Codec DMA Address Spaces

maintainers:
  - Silvia <2824799@users.noreply.github.com>

description: |
  Auxiliary DMA devices describing the address spaces the VCP firmware and
  its codec engines use. Decoder compressed bitstreams occupy multimedia
  IOMMU domain five, pseudo LARB33 port zero, 0x110000000 through
  0x12fffffff. The decoder's unified buffer engine uses display IOMMU domain
  one, LARB5 port five, 0x20000000 through 0x32bfffff. Encoder bitstreams
  occupy video IOMMU domain six, pseudo LARB33 port one, 0x130000000 through
  0x14fffffff.

properties:
  compatible:
    enum:
      - mediatek,mt6895-vcp-vdec-dma
      - mediatek,mt6895-vcp-venc-dma
      - mediatek,mt6895-vdec-ube-dma

  iommus:
    maxItems: 1

required:
  - compatible
  - iommus

additionalProperties: false
