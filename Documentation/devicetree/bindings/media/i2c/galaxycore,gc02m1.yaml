%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/galaxycore,gc02m1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GalaxyCore GC02M1 2 Mpixel MIPI CSI-2 image sensor

maintainers:
  - Akisaira <akisaira@outlook.com>

description:
  The GalaxyCore GC02M1 is a 1600x1200 raw Bayer image sensor with a
  single-lane MIPI CSI-2 D-PHY transmitter and an I2C compatible control
  interface. The digital core is supplied by an internal regulator.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: galaxycore,gc02m1

  reg:
    maxItems: 1

  clocks:
    description: External clock (MCLK), 24 MHz.
    maxItems: 1

  avdd-supply:
    description: Analogue supply, 2.8 V.

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  reset-gpios:
    description: GPIO connected to the active-low RESETB pin.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dovdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@37 {
            compatible = "galaxycore,gc02m1";
            reg = <0x37>;
            avdd-supply = <&vreg_cam_avdd_2p8>;
            clocks = <&cam_mclk>;
            dovdd-supply = <&vreg_cam_dovdd_1p8>;
            orientation = <1>;
            reset-gpios = <&pio 154 GPIO_ACTIVE_LOW>;
            rotation = <270>;

            port {
                endpoint {
                    data-lanes = <1>;
                    link-frequencies = /bits/ 64 <336000000>;
                    remote-endpoint = <&csi_in>;
                };
            };
        };
    };
...
