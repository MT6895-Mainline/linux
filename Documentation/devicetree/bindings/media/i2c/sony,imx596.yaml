%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx596.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX596 20 Mpixel MIPI CSI-2 image sensor

maintainers:
  - Akisaira <akisaira@outlook.com>

description:
  The Sony IMX596 is a 20 Mpixel raw image sensor with a quad Bayer colour
  filter array, a four-lane MIPI CSI-2 D-PHY transmitter and an I2C
  compatible control interface.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx596

  reg:
    maxItems: 1

  clocks:
    description: External clock (INCK), 24 MHz.
    maxItems: 1

  avdd-supply:
    description: Analogue supply, 2.9 V.

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  dvdd-supply:
    description: Digital core supply, 1.1 V.

  vcam-supply:
    description:
      Additional 1.2 V camera module supply that some boards switch on
      before the other supplies. Its use inside the module is not
      documented.

  reset-gpios:
    description: GPIO connected to the active-low XCLR pin.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dovdd-supply
  - dvdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "sony,imx596";
            reg = <0x10>;
            avdd-supply = <&vreg_cam_avdd_2p9>;
            clocks = <&cam_mclk>;
            dovdd-supply = <&vreg_cam_dovdd_1p8>;
            dvdd-supply = <&vreg_cam_dvdd_1p1>;
            orientation = <0>;
            reset-gpios = <&pio 153 GPIO_ACTIVE_LOW>;
            vcam-supply = <&vreg_cam_vcam_1p2>;

            port {
                endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <678000000>;
                    remote-endpoint = <&csi_in>;
                };
            };
        };
    };
...
